name: 更新六合彩結果

on:
  schedule:
    # 每晚香港時間約 10:20 同 11:50（開獎後）各檢查一次
    - cron: '20 14 * * *'
    - cron: '50 15 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: '下載全部歷史資料（第一次設定時揀 true）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 取得開獎結果
        run: node update.mjs ${{ inputs.backfill && 'backfill' || '' }}
      - name: 儲存
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            if git diff --cached --quiet -- data/draws.csv; then MSG="更新檢查時間"; else MSG="更新六合彩結果"; fi
            git commit -m "$MSG"
            git push
          else
            echo "冇新資料"
          fi
